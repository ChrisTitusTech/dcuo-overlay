[package]
name = "dcuo-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "DC Universe Online companion for Linux and Windows"
license = "GPL-3.0-only"

[features]
default = ["window"]
window = ["dep:eframe", "dep:winit", "dep:x11rb", "dep:image", "dep:lzokay"]

[dependencies]
base64 = "0.23.1"
libc = "0.2.186"
sha2 = "0.10.9"
ureq = "3.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
lzokay = { version = "2.0.1", default-features = false, features = ["decompress", "std"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
winit = { version = "0.30.13", default-features = false, features = ["x11", "rwh_06"], optional = true }
httpdate = "1.0.3"
memchr = "2.8.3"

[[bin]]
name = "dcuo-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "dcuo-window-probe"
path = "src/bin/window_probe.rs"
required-features = ["window"]

[[bin]]
name = "dcuo-companion"
path = "src/bin/companion.rs"
required-features = ["window"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", optional = true, features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_LibraryLoader",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_System_ProcessStatus",
] }
