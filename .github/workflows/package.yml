name: Release packages
on:
  workflow_dispatch:
  push:
    branches: [codex/release-0.1]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb xdotool x11-utils rpm patchelf desktop-file-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo test --locked --no-default-features --lib -- --test-threads=1
      - run: cargo build --locked --release --bin dcuo-companion
      - run: python3 scripts/test_install_local.py
      - run: python3 scripts/release/package_linux.py appimage
      - run: python3 scripts/release/package_linux.py rpm
      - name: Inspect RPM contents and smoke AppImage without FUSE
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rpm -qpl dist/*.rpm
          xvfb-run -a python3 scripts/check_x11.py --binary dist/DCUO-Companion-0.1.0-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo test --locked --no-default-features --lib -- --test-threads=1
      - run: cargo build --locked --release --bin dcuo-companion
      - name: Native desktop input and capture checks
        env:
          DCUO_WINDOWS_DESKTOP_TEST: '1'
        run: cargo test --locked native_test_window_ -- --ignored --test-threads=1
      - name: Compile per-user installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { choco install nsis --yes --no-progress }
          & $makensis packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
      - name: Test install and uninstall
        shell: pwsh
        run: ./scripts/release/test_windows_installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error
